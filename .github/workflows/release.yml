name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write  # required to create the GitHub Release and upload assets

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          # Tag builds use the tag (minus its "v"); anything else is an edge
          # build named after the short commit SHA.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="edge-$(git rev-parse --short HEAD)"
            TAG="${VERSION}"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & package all platforms
        env:
          BINARY: llm-proxy
          PKG: github.com/thelonelyghost/llm-proxy
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/
          PLATFORMS='linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64'
          for PLATFORM in $PLATFORMS; do
            export GOOS="${PLATFORM%/*}"
            export GOARCH="${PLATFORM#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT='.exe'; fi

            OUT="${BINARY}-${GOOS}-${GOARCH}${EXT}"

            go build -trimpath \
              -ldflags="-s -w -X '${PKG}/internal/cli.Version=${VERSION}'" \
              -o "dist/${OUT}" "./cmd/${BINARY}"
          done

          cd ./dist/
          sha256sum "${BINARY}"-* > SHA256SUMS

      - name: Create GitHub Release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          EXTRA=()
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            # Edge build: the tag does not exist yet, so pin it to the built commit.
            EXTRA=(--target "${GITHUB_SHA}" --prerelease)
          fi
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --generate-notes \
            "${EXTRA[@]}" \
            ./dist/*
